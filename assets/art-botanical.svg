    <path d="M700 650 c.45 4.8 3 7.5 7.8 7.8 -4.8.45 -7.35 3 -7.8 7.8 -.45-4.8-3-7.35-7.8-7.8 4.8-.45 7.35-3 7.8-7.8Z" opacity="0.7"/>
